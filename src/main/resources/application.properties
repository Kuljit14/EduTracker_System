server.port=8080
spring.application.name=edutrack-backend

# H2 Database file-based persistence (saves state in ./data/edutrack)
spring.datasource.url=jdbc:h2:file:./data/edutrack;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Serve static web frontend from classpath:/static/
spring.web.resources.static-locations=classpath:/static/
