server.port=8080
spring.application.name=edutrack-backend

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# Connects to local MySQL. Auto-creates 'edutracker_db' if it doesn't exist yet.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:edutracker_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
# Auto-creates/updates all tables in MySQL matching JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Serve static web frontend from classpath:/static/
spring.web.resources.static-locations=classpath:/static/
